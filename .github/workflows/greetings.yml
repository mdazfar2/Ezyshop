name: Greetings

on:
  fork:
  push:
    branches: [main]
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    env:
      AZFARAI_APP_ID: ${{ secrets.AZFARAI_APP_ID }}
      AZFARAI_PRIVATE_KEY: ${{ secrets.AZFARAI_PRIVATE_KEY }}
    steps:
      - name: Generate AzfarAi Bot Token
        id: azfarai-token
        if: env.AZFARAI_APP_ID != '' && env.AZFARAI_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AZFARAI_APP_ID }}
          private-key: ${{ secrets.AZFARAI_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Community Welcome Action
        uses: EddieHubCommunity/gh-action-community/src/welcome@main
        with:
          github-token: ${{ steps.azfarai-token.outputs.token || secrets.AZFARAI_TOKEN || secrets.GITHUB_TOKEN }}
          issue-message: "Hello ${{ github.actor }}! Thanks for opening an issue in Ezyshop! 🚀 \n\n - We'll get back to you as soon as possible. \n\n - Hope you star our [Repo](https://github.com/mdazfar2/Ezyshop). \n\n - Join our [Discord Server](https://discord.gg/YnABU7tdU3) to collaborate and discuss further. "
          pr-message: "Thank you, ${{ github.actor }}, for your contribution! Your pull request has been submitted successfully. A maintainer will review it as soon as possible. We appreciate your support in making Ezyshop better. 🎉 "
