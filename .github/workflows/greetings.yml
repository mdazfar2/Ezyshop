name: Greetings and Bot Automation

on:
  issues:
    types: [opened, assigned, closed]
  pull_request_target:
    types: [opened, closed]

jobs:
  automate-comments:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    env:
      AZFARAI_APP_ID: ${{ secrets.AZFARAI_APP_ID }}
      AZFARAI_PRIVATE_KEY: ${{ secrets.AZFARAI_PRIVATE_KEY }}
    steps:
      - name: Generate AzfarAi Bot Token
        id: azfarai-token
        if: env.AZFARAI_APP_ID != '' && env.AZFARAI_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AZFARAI_APP_ID }}
          private-key: ${{ secrets.AZFARAI_PRIVATE_KEY }}

      - name: AzfarAi Comment Handler
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.azfarai-token.outputs.token || secrets.AZFARAI_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const eventName = context.eventName;
            const action = context.payload.action;
            const issue_number = context.payload.issue?.number || context.payload.pull_request?.number;
            const author = context.payload.issue?.user?.login || context.payload.pull_request?.user?.login || context.actor;

            let body = '';

            if (eventName === 'issues') {
              if (action === 'opened') {
                body = `Hello @${author}! Thanks for opening an issue in Ezyshop! 🚀\n\nLet's take Ezyshop to the next level together!\n\nBefore proceeding, please make sure you have reviewed our [Contributing Guidelines](https://github.com/mdazfar2/Ezyshop/blob/main/CONTRIBUTING.md?utm_source=chatgpt.com) to ensure your issue follows our project standards.\n\nHere are a few ways to stay connected:\n- ⭐ Star our [Repo](https://github.com/mdazfar2/Ezyshop) to show your support.\n- 💬 Join our [Discord Server](https://discord.gg/YnABU7tdU3) to collaborate and discuss ideas.\n- 💼 Follow our [LinkedIn](https://www.linkedin.com/company/ezyshopz/?utm_source=chatgpt.com) company page for updates and announcements.\n\nWe'll review your issue and get back to you as soon as possible!`;
              } else if (action === 'assigned') {
                const assignee = context.payload.assignee?.login;
                if (assignee) {
                  body = `👤 Issue assigned to @${assignee}.`;
                }
              } else if (action === 'closed') {
                body = `✅ This issue has been closed. Thank you for your contribution!`;
              }
            } else if (eventName === 'pull_request_target') {
              if (action === 'opened') {
                body = `Thank you, @${author}, for your contribution! Your pull request has been submitted successfully. 🎉\n\nA maintainer will review your PR shortly. They may suggest adjustments or improvements before it gets approved and merged. Please keep an eye on this thread for any review feedback.\n\n### 🛠️ Production Build Verification\nTo ensure smooth reviews and prevent Vercel deployment errors, please verify your changes locally:\n1. Check linting: \`npm run lint\` (or auto-fix with \`npm run lint -- --fix\`)\n2. Build the project: \`npm run build\`\n3. Attach a screenshot showing a successful \`npm run build\` output in your PR description or comments below.\n\n### 🌟 Stay Connected\n- ⭐ Star our [Repo](https://github.com/mdazfar2/Ezyshop) to support the project.\n- 💬 Join our [Discord Server](https://discord.gg/YnABU7tdU3) to collaborate with the community.\n- 💼 Follow our [LinkedIn](https://www.linkedin.com/company/ezyshopz/?utm_source=chatgpt.com) company page for the latest news.\n\nWe appreciate your effort in making Ezyshop better! 🚀`;
              } else if (action === 'closed') {
                const isMerged = Boolean(context.payload.pull_request?.merged);
                if (isMerged) {
                  body = `🎉 Congratulations, @${author}! Your pull request has been successfully merged. Thank you so much for your contribution!`;
                } else {
                  body = `This pull request has been closed without being merged. Thank you, @${author}, for your time and contribution!`;
                }
              }
            }

            if (body && issue_number) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: body
              });
            }
